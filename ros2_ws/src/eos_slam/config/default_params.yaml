# EOS-SLAM default parameters (ROS 2 params file: node names must match launch "name=")

eos_sensor_processor:
  ros__parameters:
    rgb:
      max_features: 500
      quality_level: 1.0
      min_distance: 7.0
    depth:
      min_depth: 0.1
      max_depth: 10.0
    lidar:
      voxel_size: 0.1
      min_range: 0.5
      max_range: 30.0

eos_rgbd_odometry:
  ros__parameters:
    vo:
      max_features: 500
      min_depth: 0.1
      max_depth: 10.0
      keyframe_interval: 5

eos_mapper:
  ros__parameters:
    map:
      voxel_size: 0.05        # 3D map resolution (m)
      grid_resolution: 0.05   # 2D occupancy grid cell size (m)
      grid_width: 400         # grid cells → 20 m × 20 m at 0.05 m/cell
      grid_height: 400
      publish_every_n: 5      # publish after every N clouds accumulated
      min_obstacle_z: 0.10    # ignore floor returns below this height (m)
      max_obstacle_z: 2.00    # ignore ceiling returns above this height (m)

eos_loop_closure:
  ros__parameters:
    loop:
      min_keyframe_dist:   0.5    # m — min travel before adding a new keyframe
      candidate_radius:    3.0    # m — search radius for loop candidates
      min_age_gap:         20     # keyframes — avoid matching recent frames
      icp_max_dist:        0.5    # ICP correspondence distance (m)
      icp_fitness_thresh:  0.05   # ICP fitness score threshold (lower = tighter)
      icp_max_iter:        50
