# EOS-SLAM default parameters

sensor_processor:
  rgb:
    max_features: 500
    quality_level: 1.0
  depth:
    min_depth: 0.1
    max_depth: 10.0
  lidar:
    voxel_size: 0.1
    min_range: 0.5
    max_range: 30.0

rgbd_odometry:
  vo:
    max_features: 500
    min_depth: 0.1
    max_depth: 10.0
    keyframe_interval: 5
